name: Build APK from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          mkdir -p src
          unzip -q "$ZIP" -d src

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - run: gradle -p src assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SaintFlorida-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk
